
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stick Fight: The Game</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="stylesheet" href="TemplateData/webport.css">

  <style>
    #unity-loading-text {
      margin-top: 14px;
      color: white;
      font: 14px Arial, sans-serif;
      text-align: center;
    }

    #unity-loading-details {
      margin-top: 6px;
      color: #aaa;
      font: 12px Arial, sans-serif;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">

    <canvas
      id="unity-canvas"
      width="960"
      height="600"
      tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>

      <div id="unity-loading-text">
        Preparing game...
      </div>

      <div id="unity-loading-details"></div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Stick Fight The Game</div>
    </div>

  </div>

  <script>
    const buildUrl = "Build";

    const loaderUrl =
      buildUrl +
      "/e6321c6830e66ee9a1563e4796f8bb69.loader.js";

    // Original Unity WebGL files
    const config = {
      autoSyncPersistentDataPath: true,
      matchWebGLToCanvasSize: true,
      devicePixelRatio: 1,
      arguments: [],

      dataUrl:
        buildUrl +
        "/130fef5c1e37332a85c313df0266f7b7.data.unityweb",

      frameworkUrl:
        buildUrl +
        "/d260150b95db1077e2e948e176f49699.framework.js.unityweb",

      codeUrl:
        buildUrl +
        "/c4ca339e813ee855ee9b82fef1145946.wasm.unityweb",

      symbolsUrl:
        buildUrl +
        "/e1e1b3684d9a3641c88d2569a789928b.symbols.json.unityweb",

      streamingAssetsUrl: "StreamingAssets",
      companyName: "Landfall West",
      productName: "Stick Fight The Game",
      productVersion: "1.0",

      showBanner: unityShowBanner
    };

    // Exact split files from your Build folder
    const DATA_PARTS = [
      "data.unityweb.part-00",
      "data.unityweb.part-01",
      "data.unityweb.part-02",
      "data.unityweb.part-03"
    ];

    const WASM_PARTS = [
      "wasm.unityweb.part-00",
      "wasm.unityweb.part-01"
    ];

    // Optional exact byte-size verification
    const DATA_SIZE = null;
    const WASM_SIZE = null;

    const canvas =
      document.querySelector("#unity-canvas");

    const loadingBar =
      document.querySelector("#unity-loading-bar");

    const progressBar =
      document.querySelector("#unity-progress-bar-full");

    const loadingText =
      document.querySelector("#unity-loading-text");

    const loadingDetails =
      document.querySelector("#unity-loading-details");

    function unityShowBanner(message, type) {
      const banner =
        document.querySelector("#unity-warning");

      const div = document.createElement("div");
      div.textContent = message;
      div.style.padding = "10px";

      if (type === "error") {
        div.style.background = "red";
        div.style.color = "white";
      } else {
        div.style.background = "yellow";
        div.style.color = "black";
      }

      banner.appendChild(div);
      banner.style.display = "block";

      if (type !== "error") {
        setTimeout(() => {
          div.remove();

          if (!banner.children.length) {
            banner.style.display = "none";
          }
        }, 5000);
      }
    }

    function setProgress(percent) {
      const value = Math.max(0, Math.min(100, percent));
      progressBar.style.width = value + "%";
    }

    function setLoadingText(text) {
      loadingText.textContent = text;
    }

    function setLoadingDetails(text) {
      loadingDetails.textContent = text;
    }

    function formatBytes(bytes) {
      return (bytes / 1024 / 1024).toFixed(1) + " MB";
    }

    // Download and reconstruct a split Unity file
    async function downloadSplitFile(
      partNames,
      expectedSize,
      label,
      startProgress,
      endProgress
    ) {
      const chunks = [];
      let downloadedBytes = 0;

      for (let i = 0; i < partNames.length; i++) {
        const partName = partNames[i];

        setLoadingText(
          `${label} ${i + 1}/${partNames.length}`
        );

        const response = await fetch(
          `${buildUrl}/${partName}`,
          { cache: "default" }
        );

        if (!response.ok) {
          throw new Error(
            `Could not download ${partName} ` +
            `(HTTP ${response.status})`
          );
        }

        const chunk = new Uint8Array(
          await response.arrayBuffer()
        );

        chunks.push(chunk);
        downloadedBytes += chunk.byteLength;

        setLoadingDetails(
          `Downloaded ${formatBytes(downloadedBytes)}`
        );

        const progress =
          startProgress +
          (endProgress - startProgress) *
          ((i + 1) / partNames.length);

        setProgress(progress);
      }

      if (
        expectedSize !== null &&
        downloadedBytes !== expectedSize
      ) {
        throw new Error(
          `${label} size mismatch. ` +
          `Expected ${expectedSize} bytes, ` +
          `received ${downloadedBytes} bytes.`
        );
      }

      setLoadingText(`Reconstructing ${label}...`);

      const output = new Uint8Array(downloadedBytes);
      let offset = 0;

      for (const chunk of chunks) {
        output.set(chunk, offset);
        offset += chunk.byteLength;
      }

      return output;
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = url;
        script.onload = resolve;

        script.onerror = () => {
          reject(new Error(`Failed to load ${url}`));
        };

        document.body.appendChild(script);
      });
    }

    // Start Unity using reconstructed files
    async function startUnity() {
      try {
        loadingBar.style.display = "block";
        setProgress(0);

        // Step 1: Download game data
        const dataBytes = await downloadSplitFile(
          DATA_PARTS,
          DATA_SIZE,
          "Downloading game data",
          0,
          35
        );

        // Step 2: Download WebAssembly
        const wasmBytes = await downloadSplitFile(
          WASM_PARTS,
          WASM_SIZE,
          "Downloading engine",
          35,
          70
        );

        // Step 3: Reconstruct compressed Unity files
        setLoadingText("Preparing Unity files...");
        setLoadingDetails("Reconstructing original game files");

        const dataBlob = new Blob(
          [dataBytes],
          { type: "application/octet-stream" }
        );

        const wasmBlob = new Blob(
          [wasmBytes],
          { type: "application/octet-stream" }
        );

        const dataObjectUrl =
          URL.createObjectURL(dataBlob);

        const wasmObjectUrl =
          URL.createObjectURL(wasmBlob);

        // Unity's loader reads these reconstructed URLs.
        config.dataUrl = dataObjectUrl;
        config.codeUrl = wasmObjectUrl;

        // Step 4: Load the original Unity loader
        setLoadingText("Loading Unity engine...");
        setLoadingDetails("");

        await loadScript(loaderUrl);

        if (typeof createUnityInstance !== "function") {
          throw new Error(
            "Unity loader failed to initialize."
          );
        }

        // Step 5: Start the original game
        setLoadingText("Starting Stick Fight The Game...");

        const unityInstance = await createUnityInstance(
          canvas,
          config,
          progress => {
            setProgress(70 + progress * 30);
          }
        );

        setProgress(100);
        loadingBar.style.display = "none";

        // Fullscreen button
        document.querySelector(
          "#unity-fullscreen-button"
        ).onclick = () => {
          unityInstance.SetFullscreen(1);
        };

        // Keep object URLs alive while Unity is running.
        // They can be released when the page unloads.

      } catch (error) {
        console.error("Unity startup failed:", error);

        setLoadingText("Failed to load game");
        setLoadingDetails(
          error.message || String(error)
        );

        unityShowBanner(
          error.message || String(error),
          "error"
        );
      }
    }

    // Mobile configuration
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement("meta");

      meta.name = "viewport";
      meta.content =
        "width=device-width, height=device-height, " +
        "initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

      document.head.appendChild(meta);

      document.querySelector(
        "#unity-container"
      ).className = "unity-mobile";

      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    startUnity();
  </script>

  <script src="TemplateData/webport-controls.js"></script>
</body>
</html>
