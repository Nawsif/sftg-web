
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stick Fight The Game</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="stylesheet" href="TemplateData/webport.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas
      id="unity-canvas"
      width="960"
      height="600"
      tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Stick Fight The Game</div>
    </div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBar = document.querySelector("#unity-progress-bar-full");

    const buildUrl = "Build";

    const loaderUrl =
      buildUrl + "/d29c9052e1e725d21878742b1150b7d6.loader.js";

    const wasmName =
      "484d7656c640b687efa07eeaf0885203.wasm.unityweb";

    const dataName =
      "ac8e5d62420dcbe201fbf791302d35c6.data.unityweb";

    const frameworkName =
      "4b0db9fe5091746a7824179da6ea2981.framework.js.unityweb";

    const symbolsName =
      "5a53ff090109b5a2e66ca3039a7cd476.symbols.json.unityweb";

    const WASM_PARTS = 2;
    const DATA_PARTS = 4;

    const objectUrls = [];

    function unityShowBanner(message, type) {
      const banner = document.querySelector("#unity-warning");

      const div = document.createElement("div");
      div.textContent = message;

      if (type === "error") {
        div.style.cssText =
          "background:#c62828;color:white;padding:10px;";
      } else {
        div.style.cssText =
          "background:#ffeb3b;color:black;padding:10px;";

        setTimeout(() => {
          div.remove();

          if (!banner.children.length) {
            banner.style.display = "none";
          }
        }, 5000);
      }

      banner.appendChild(div);
      banner.style.display = "block";
    }

    function updateProgress(percent) {
      progressBar.style.width =
        Math.max(0, Math.min(100, percent)) + "%";
    }

    async function downloadPart(url) {
      console.log("[Unity] Downloading:", url);

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          "Failed to download " +
          url +
          " (HTTP " +
          response.status +
          ")"
        );
      }

      return await response.arrayBuffer();
    }

    async function assembleFile(filename, partCount, progressCallback) {
      console.log(
        "[Unity] Reassembling:",
        filename,
        "from",
        partCount,
        "parts"
      );

      const chunks = [];
      let totalSize = 0;

      for (let i = 1; i <= partCount; i++) {
        const partUrl =
          buildUrl + "/" + filename + ".part" + i;

        const buffer = await downloadPart(partUrl);

        chunks.push(buffer);
        totalSize += buffer.byteLength;

        console.log(
          "[Unity] Loaded part",
          i,
          "of",
          partCount,
          "-",
          buffer.byteLength,
          "bytes"
        );

        if (progressCallback) {
          progressCallback(i / partCount);
        }
      }

      const blob = new Blob(chunks, {
        type: "application/octet-stream"
      });

      if (blob.size !== totalSize) {
        throw new Error(
          "Reassembled file size mismatch: " + filename
        );
      }

      const blobUrl = URL.createObjectURL(blob);

      objectUrls.push(blobUrl);

      console.log(
        "[Unity] Reassembled successfully:",
        filename,
        blob.size,
        "bytes"
      );

      return blobUrl;
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = url;

        script.onload = () => resolve();

        script.onerror = () => {
          reject(
            new Error("Unable to load Unity loader: " + url)
          );
        };

        document.body.appendChild(script);
      });
    }

    async function startUnity() {
      loadingBar.style.display = "block";
      updateProgress(0);

      try {
        console.log("[Unity] Starting split-file loader");

        const dataUrl = await assembleFile(
          dataName,
          DATA_PARTS,
          progress => {
            updateProgress(progress * 35);
          }
        );

        const codeUrl = await assembleFile(
          wasmName,
          WASM_PARTS,
          progress => {
            updateProgress(35 + progress * 15);
          }
        );

        console.log("[Unity] All split files assembled");

        const config = {
          autoSyncPersistentDataPath: true,
          matchWebGLToCanvasSize: true,
          devicePixelRatio: 1,
          arguments: [],

          dataUrl: dataUrl,

          frameworkUrl:
            buildUrl + "/" + frameworkName,

          codeUrl: codeUrl,

          symbolsUrl:
            buildUrl + "/" + symbolsName,

          streamingAssetsUrl: "StreamingAssets",

          companyName: "Landfall West",
          productName: "Stick Fight The Game",
          productVersion: "1.0",

          showBanner: unityShowBanner
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          const meta = document.createElement("meta");

          meta.name = "viewport";
          meta.content =
            "width=device-width,height=device-height," +
            "initial-scale=1.0,user-scalable=no,shrink-to-fit=yes";

          document.head.appendChild(meta);

          document.querySelector("#unity-container").className =
            "unity-mobile";

          canvas.className = "unity-mobile";
        } else {
          canvas.style.width = "960px";
          canvas.style.height = "600px";
        }

        console.log("[Unity] Loading Unity loader");

        await loadScript(loaderUrl);

        if (typeof createUnityInstance !== "function") {
          throw new Error(
            "Unity loader failed to initialize createUnityInstance"
          );
        }

        console.log("[Unity] Creating Unity instance");

        const unityInstance = await createUnityInstance(
          canvas,
          config,
          progress => {
            updateProgress(50 + progress * 50);
          }
        );

        updateProgress(100);

        loadingBar.style.display = "none";

        document.querySelector(
          "#unity-fullscreen-button"
        ).onclick = () => {
          unityInstance.SetFullscreen(1);
        };

        console.log("[Unity] Game loaded successfully");

      } catch (error) {
        console.error("[Unity] Loading failed:", error);

        unityShowBanner(
          error.message || String(error),
          "error"
        );
      }
    }

    startUnity();
  </script>

  <script src="TemplateData/webport-controls.js"></script>
</body>
</html>
